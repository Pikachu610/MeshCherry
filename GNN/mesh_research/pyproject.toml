[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-research"
dynamic = ["version"]
description = "Reproducible unstructured-mesh research pipeline for the GNN track"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
  "pyshp>=2.3,<3",
  "matplotlib>=3.9,<4",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7"]

[project.scripts]
mesh-research = "mesh_research.__main__:main"
gis-mesh-workbench = "gis_mesh_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "gis_mesh_workbench._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gis_mesh_workbench = ["*.json", "webui/*.html", "webui/*.js", "webui/*.css", "webui/*.png", "webui/*.ico", "webui/fonts/*.ttf", "webui/fonts/OFL.txt", "sample_data/*.tif", "sample_data/*.json"]

